services:
  db:
    image: postgres:16-alpine
    container_name: querypilot_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: qp_dev
      POSTGRES_DB: querypilot
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: querypilot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin_data:
